<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af7a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c9956a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8835a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="100" cy="90" r="72" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <!-- Inner ring -->
  <circle cx="100" cy="90" r="64" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>

  <!-- Letter C -->
  <text
    x="100" y="110"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="68"
    font-weight="400"
    fill="url(#goldGrad)"
    letter-spacing="0"
  >C</text>

  <!-- CHARLOTTE text -->
  <text
    x="100" y="178"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="16"
    font-weight="400"
    fill="url(#goldGrad)"
    letter-spacing="6"
  >CHARLOTTE</text>

  <!-- Thin decorative line under text -->
  <line x1="60" y1="186" x2="140" y2="186" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6"/>
</svg>
